spring.application.name=livraison
server.port=${SERVER_PORT:8084}
spring.datasource.url=jdbc:mysql://localhost:3306/livraison
spring.datasource.username=root
spring.datasource.password=
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.thymeleaf.cache=false
app.demo.enabled=${APP_DEMO_ENABLED:false}

# Routage routier : osrm | openrouteservice
# Sans cle ORS_API_KEY, le fournisseur openrouteservice bascule automatiquement
# sur le calcul en ligne droite (RouteDto.approximative = true).
livraison.route.provider=${ROUTE_PROVIDER:osrm}
livraison.route.osrm-url=${OSRM_URL:https://router.project-osrm.org}
livraison.route.ors-url=${ORS_URL:https://api.heigit.org/openrouteservice}
livraison.route.ors-api-key=${ORS_API_KEY:}
livraison.route.ors-profile=${ORS_PROFILE:driving-car}
livraison.route.cache-seconds=${ROUTE_CACHE_SECONDS:60}
