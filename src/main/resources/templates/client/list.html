<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/head :: head('Clients')}"></head>
<body class="app-body">
    <!-- Barre de navigation -->
    <div th:replace="~{fragments/nav :: nav('clients')}"></div>

    <main class="app-main">
    <div class="container-fluid app-page">
        <div class="page-header">
            <div>
                <h1 class="page-header__title">Clients</h1>
                <p class="page-header__subtitle">Carnet d'adresses et coordonnées</p>
            </div>
            <div class="page-header__actions">
                <a th:href="@{/clients/new}" class="btn btn-primary btn-icon">
                    <i class="bi bi-plus-lg"></i> Nouveau client
                </a>
            </div>
        </div>

        <div th:replace="~{fragments/flash :: flash}"></div>

        <div class="filter-bar">
            <div class="filter-bar__search">
                <i class="bi bi-search"></i>
                <input type="search" placeholder="Rechercher un client (nom, email, téléphone…)"
                       aria-label="Filtrer les clients" autocomplete="off"
                       data-table-filter="#clientsTable">
            </div>
            <span class="filter-bar__hint"><i class="bi bi-funnel"></i> Filtrage instantané sur la page</span>
        </div>

        <div class="app-table-wrap table-responsive">
            <table class="table table-hover app-table" id="clientsTable">
                <thead>
                    <tr>
                        <th>Client</th>
                        <th>Téléphone</th>
                        <th>Email</th>
                        <th>Adresse</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="client : ${clients}" data-filter-row>
                        <td>
                            <div class="identity-cell">
                                <span class="avatar-initials avatar-initials--sm"
                                      th:attr="data-avatar-name=${client.prenom + ' ' + client.nom}"></span>
                                <div class="identity-cell__meta">
                                    <span class="identity-cell__name"
                                          th:text="${client.prenom + ' ' + client.nom}">Client</span>
                                    <span class="identity-cell__sub" th:text="'#' + ${client.id}">#0</span>
                                </div>
                            </div>
                        </td>
                        <td th:text="${#strings.isEmpty(client.telephone)} ? '—' : ${client.telephone}">—</td>
                        <td>
                            <a th:if="${!#strings.isEmpty(client.email)}"
                               th:href="|mailto:${client.email}|"
                               th:text="${client.email}">—</a>
                            <span th:if="${#strings.isEmpty(client.email)}" class="text-muted">—</span>
                        </td>
                        <td class="text-muted"
                            th:text="${#strings.isEmpty(client.adresse)} ? '—' : ${client.adresse}">—</td>
                        <td class="text-end">
                            <div class="d-inline-flex gap-1">
                                <a th:href="@{/clients/edit/{id}(id=${client.id})}"
                                   class="btn btn-sm btn-outline-warning btn-action-icon"
                                   data-bs-toggle="tooltip" title="Modifier">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/clients/delete/{id}(id=${client.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-danger btn-action-icon"
                                            data-confirm="Voulez-vous vraiment supprimer ce client ?"
                                            data-bs-toggle="tooltip" title="Supprimer">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(clients)}" data-no-filter>
                        <td colspan="5">
                            <div class="app-empty-state">
                                <i class="bi bi-people"></i>
                                <strong>Aucun client trouvé</strong>
                                <div class="mt-1">Créez un premier client pour démarrer.</div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    </main>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
